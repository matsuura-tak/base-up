      required:
        - simulationSnapshot
        - stageAuditReport
        - audioState
        - persistedState
        - storageStatus
        - diagnosticProfile
        - emittedEvents
      properties:
        simulationSnapshot:
          $ref: "#/components/schemas/SimulationSnapshot"
