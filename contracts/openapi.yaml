        persistedState:
          $ref: "#/components/schemas/PersistedArcadeStateV1"
        storageStatus:
          $ref: "#/components/schemas/StorageStatus"
        diagnosticProfile:
          $ref: "#/components/schemas/DiagnosticProfile"
        emittedEvents:
          type: array
          items:
            $ref: "#/components/schemas/TelemetryEvent"
